# cargo-mutants configuration: `just mutants`. https://mutants.rs
#
# The files listed here hold the decisions of the alignment logic: what a reading is worth, what step is taken,
# when an axis is called suspect, where a move may go. A mutant that survives in one is an untested boundary: kill
# it with a test, or, only if it cannot change any observable behavior, exclude it below with the reason. Never
# exclude a mutant because it is hard to kill.

examine_globs = [
  "crates/align-core/src/approach.rs",
  "crates/align-core/src/calibration.rs",
  "crates/align-core/src/measurement.rs",
  "crates/align-core/src/quadrant.rs",
  "crates/align-core/src/solver.rs",
  "crates/align-core/src/units.rs",
  # The procedure has no unit tests of its own: the closed-loop tests in align-sim are what hold it.
  "crates/align-core/src/aligner.rs",
  # When the relay may open the laser loop and the motors may move.
  "crates/align-core/src/coordinator.rs",
  # What a node takes a frame to mean, and whether it runs a move: a wrong byte here moves a screw.
  "crates/align-proto/src/frame.rs",
  "crates/align-proto/src/message.rs",
  "crates/align-proto/src/dedup.rs",
  # What reaches the coils, and when a move ends.
  "crates/stepper/src/lib.rs",
  # Whether a node moves, refuses, stops, or arms, and what it remembers.
  "crates/node-logic/src/node.rs",
  "crates/node-logic/src/record.rs",
  "crates/node-logic/src/console.rs",
  # What the sensor answers, when, and to whom.
  "crates/sensor-logic/src/node.rs",
  "crates/sensor-logic/src/buttons.rs",
  "crates/sensor-logic/src/console.rs",
  # Whether the coordinator counts a node as present, lost, or restarted, and which reading answers which shot.
  "crates/coordinator-logic/src/nodes.rs",
  "crates/coordinator-logic/src/readings.rs"
]

# The firmware crates cannot build on the host, so the workspace is never tested as a whole. A mutant in
# align-core is judged by its own tests and by the simulator's; one in another crate by that crate's own.
test_package = ["align-core", "align-sim", "align-proto", "stepper", "node-logic", "sensor-logic", "coordinator-logic"]

# The three fields of an identifier occupy disjoint bits, so combining them with `^` instead of `|` gives the same
# identifier for every input: these mutants cannot change behavior.
#
# `Stepper::run` returns before computing the direction when `steps == 0`, so `steps > 0` and `steps >= 0` agree on
# every value that reaches that line.
#
# `Aligner::leg` returns before it sets the last direction when `steps == 0`, so `steps > 0` and `steps >= 0` agree
# on every value that reaches that line.
exclude_re = [
  "replace \\| with \\^ in compose_id",
  "replace > with >= in Stepper<P>::run",
  "replace > with >= in Aligner<A, S>::leg"
]
