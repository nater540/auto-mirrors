[workspace]
resolver = "3"
members = [
  "crates/align-core",
  "crates/align-proto",
  "crates/align-sim",
  "crates/stepper",
  "crates/node-logic",
  "firmware/node",
  "firmware/coordinator"
]
# The firmware crates build only for riscv32imac-unknown-none-elf. Leaving them out of `default-members` lets a
# plain `cargo build`, `cargo test`, or `cargo clippy` at the root work on the host crates alone. `--workspace`
# overrides this and will fail on the host; use the justfile recipes.
default-members = ["crates/align-core", "crates/align-proto", "crates/align-sim", "crates/stepper", "crates/node-logic"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Nate Strandberg"]
publish = false

[workspace.dependencies]
align-core = { path = "crates/align-core" }
align-proto = { path = "crates/align-proto" }
stepper = { path = "crates/stepper" }
node-logic = { path = "crates/node-logic" }

nalgebra = { version = "=0.35.0", default-features = false, features = ["libm"] }
libm = "0.2.16"
thiserror = { version = "2.0.21", default-features = false }
# The CAN frame trait and 11-bit identifier type that the esp-hal TWAI driver implements (esp-hal already depends on
# it). Its last release is from 2022: it is a stable trait crate maintained in the active embedded-hal repository.
bitflags = { version = "2.13.2", default-features = false }
# The pin and delay traits the stepper driver is written against: esp-hal pins and embassy-time's Delay implement
# them, and the host tests fake them.
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Simulator only (host). `rand` draws the sensor noise and the skipped steps from a seed, so that a run repeats.
rand = "0.10.4"
rand_distr = "0.6.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0.104"

# Firmware only. Exact pins: these crates change API between minor releases and must move together. The reasons
# and the upgrade procedure are in docs/VERSIONS.md.
esp-hal = { version = "=1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["embassy", "esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32c6", "log-04"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "=0.18.0", features = ["esp32c6", "log-04"] }
embassy-executor = { version = "=0.10.0", features = ["log"] }
embassy-time = { version = "=0.5.1", features = ["log"] }
# The node's queues, mutex, and signal; select; the blocking-to-async flash adapter. All three are already in the
# tree through esp-hal and esp-rtos.
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-embedded-hal = { version = "0.6.0", default-features = false }
# Position records in flash (reference 5.5): esp-storage gives the blocking flash, sequential-storage the map.
esp-storage = { version = "=0.10.0", features = ["esp32c6", "embedded-storage"] }
sequential-storage = { version = "8.0.2", default-features = false }
embedded-io-async = "0.7.0"
embedded-can = "0.4.1"
static_cell = "2.1.1"
log = "0.4.27"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# The pairs this domain is made of differ by one letter by nature: h and v, x and y, near and far legs.
similar_names = "allow"

# Firmware is always built with `--release` (see the justfile): an unoptimized esp-hal image is too large and too slow.
# These settings follow the esp-generate 2.0.0 template. They also apply to host release builds, which is harmless.
[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
